<!DOCTYPE html>
<html lang="en-gb">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Codewars Badge</title>
    <meta
      name="description"
      content="Extending HTML to create a new component"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <codewars-badge></codewars-badge>
   
    <section aria-labelledby="recent-title">
      <h2 id="recent-title">Recently Completed</h2>
      <!-- change username to yours; limit/page are optional -->
      <codewars-recent username="avatarit" limit="5" page="0"></codewars-recent>
    </section>

    <script async defer type="module" src="./codewars-badge.js"></script>
  </body>
</html>
